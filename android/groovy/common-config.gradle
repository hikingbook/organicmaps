import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform
// From organicmaps/android/build.gradle
def run(cmd) {
  def output = providers.exec {
    commandLine = cmd
    workingDir = rootProject.projectDir
  }
  return output.standardOutput.asText.get().trim()
}

def getVersion() {
  def isWindows = DefaultNativePlatform.getCurrentOperatingSystem().isWindows()
  def bash = isWindows ? 'C:\\Program Files\\Git\\bin\\bash.exe' : 'bash'
  def versionCode = Integer.parseInt(run([bash, 'organicmaps/tools/unix/version.sh', 'android_code']))
  def versionName = run([bash, 'organicmaps/tools/unix/version.sh', 'android_name'])
  return new Tuple2(versionCode, versionName)
}

rootProject.ext {
  def ver = getVersion()
  versionCode = ver.V1
  versionName = ver.V2
  CI = System.getenv("CI") != null
}

// Use the following command to apply common configuration to your module:
// apply from: "${rootProject.rootDir}/groovy/common-config.gradle"

android {
  compileSdk = propCompileSdkVersion.toInteger()
  ndkVersion = propNdkVersion

//  enableKotlin = false

  defaultConfig {
    minSdk = propMinSdkVersion.toInteger()
    targetSdk = propTargetSdkVersion.toInteger()

    buildTypes {
      debug {}
      beta {
        matchingFallbacks = ['release', 'debug']
      }
      release {}
    }

    compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
    }
  }
}

afterEvaluate {
  if (android.enableKotlin) {
    configurations {
      ktlint
    }

    dependencies {
      ktlint libs.ktlint.cli
    }

    def ktSources = fileTree('src') { include '**/*.kt' }
    def editorConfig = file("${rootProject.rootDir}/.editorconfig")

    tasks.register('ktlintCheck', JavaExec) {
      description = 'Check Kotlin code style with ktlint.'
      group = 'verification'
      classpath = configurations.ktlint
      mainClass = 'com.pinterest.ktlint.Main'
      args = ['--editorconfig=' + editorConfig.absolutePath, 'src/**/*.kt']
      inputs.files(ktSources)
      inputs.file(editorConfig)
    }

    tasks.register('ktlintFormat', JavaExec) {
      description = 'Format Kotlin code with ktlint.'
      group = 'formatting'
      classpath = configurations.ktlint
      mainClass = 'com.pinterest.ktlint.Main'
      args = ['--editorconfig=' + editorConfig.absolutePath, '--format', 'src/**/*.kt']
      inputs.files(ktSources)
      inputs.file(editorConfig)
    }
  }
}
